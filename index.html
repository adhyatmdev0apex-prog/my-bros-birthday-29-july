<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,
                   initial-scale=1.0,
                   viewport-fit=cover">

    <meta name="theme-color" content="#050816">

    <meta name="description"
          content="The Universe Prepared Something For You">

    <title>The Universe Prepared Something For You</title>

    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Poppins:wght@300;400;500;600;700&display=swap"
          rel="stylesheet">

    <!-- Styles -->

    <link rel="stylesheet" href="css/variables.css">

    <link rel="stylesheet" href="css/main.css">

    <link rel="stylesheet" href="css/animations.css">

    <link rel="stylesheet" href="css/scenes.css">

    <link rel="stylesheet" href="css/mobile.css">

    <link rel="icon"
          href="assets/icons/favicon.ico">

    <!-- PDF.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.4.178/pdf.min.mjs" type="module"></script>

</head>

<body>

    <!-- ===================================================== -->
    <!-- INITIAL PAGE LOADER                                   -->
    <!-- Appears only while CSS + JS initialize                -->
    <!-- ===================================================== -->

    <div id="boot-loader">

        <div class="loader-stars"></div>

        <div class="loader-content">

            <div class="loader-logo">

                ✦

            </div>

            <h1>

                Preparing Experience

            </h1>

            <p>

                Please wait...

            </p>

        </div>

    </div>


<!--======================================================
                    BACKGROUND ENGINE
=======================================================-->




    <!-- ===================================================== -->
    <!-- MAIN APPLICATION                                      -->
    <!-- Every scene is injected here using app.js             -->
    <!-- ===================================================== -->

    <main id="app">
<!-- ================================================= -->
<!-- HTML TEMPLATES                                   -->
<!-- Generated by JavaScript                          -->
<!-- ================================================= -->

</main>

<template id="auth-template">

<section class="scene authScene">

    <div class="glassCard">

        <div class="logo">

            ✦

        </div>

        <h1>

            PRIVATE BIRTHDAY PROTOCOL

        </h1>

        <p>

            Identity Verification Required

        </p>

        <div class="divider"></div>

        <label>

            Who is the 3rd person?

        </label>

        <input
            id="answerOne"
            autocomplete="off"
            type="password">

        <label>

            Who is the 8th grader?

        </label>

        <input
            id="answerTwo"
            autocomplete="off"
            type="password">

        <button id="verifyButton">

            Verify Identity

        </button>

        <p id="statusText">

            Only those who know
            may continue.

        </p>

    </div>

</section>

</template>

<!-- Memory Mode template removed; Memory Mode is generated dynamically in JS -->

<template id="loading-template">

<section class="scene loadingScene">

    <div class="terminalWindow">

        <div id="terminalOutput">

        </div>

    </div>

</section>

</template>

<template id="intro-template">

<section class="introScene">

<h1 id="introLine1" class="hidden">

There are

<br>

8 billion people

<br>

on this planet.

</h1>

<h1 id="introLine2" class="hidden">

Today,

<br>

one of them

<br>

has a birthday.

</h1>

<h1 id="introLine3" class="hidden">

Happy Birthday,

<br>

<span id="heroName">

Her Name

</span>

✨

</h1>

</section>

</template>

<template id="birthday-template">

<section class="scene birthdayScene">

<div class="birthdayContainer">

<h2>

Today,

</h2>

<h1>

one of them

<br>

has a birthday.

</h1>

<div class="birthdaySpacer"></div>

<h3>

Happy Birthday,

</h3>

<h1 class="heroName">

&lt;Her Name&gt;

</h1>

<div class="sparkle">

✨

</div>

</div>

</section>

</template>

<template id="mission-template">

<section class="scene missionScene">

<div class="giftBox">

🎁

</div>

<div class="missionCard">

<h1>

Today's Mission

</h1>

<ul>

<li>

✓ Smile

</li>

<li>

✓ Eat Cake

</li>

<li>

✓ Laugh A Lot

</li>

<li>

✓ Enjoy Every Moment

</li>

</ul>

<button class="acceptBtn">

Mission Accepted

</button>

</div>

</section>

</template>

<template id="cards-template">

<section class="scene cardsScene">

<div class="wishCard">

🌸

<h2>

Keep Smiling.

</h2>

</div>

<div class="wishCard">

✨

<h2>

Dream Bigger.

</h2>

</div>

<div class="wishCard">

🌍

<h2>

Travel Somewhere Amazing.

</h2>

</div>

<div class="wishCard">

🎂

<h2>

Today Is Yours.

</h2>

</div>

</section>

</template>

<template id="night-template">

<section class="scene nightScene">

<div id="shootingStarArea">

</div>

<div class="nightMessage">

Some wishes

<br>

don't need

<br>

to be spoken.

✨

</div>

</section>

</template>

<template id="cake-template">

<section class="scene cakeScene">

<div id="cake3D">

</div>

<button id="cakeButton">

Play Birthday Song

</button>

</section>

</template>

<template id="ending-template">

<section class="scene endingScene">

    <div class="endBlock">
        <h1>Happy Birthday</h1>
        <h2 class="endingName">Her Name</h2>
    </div>

    <div class="endBlock">
        <p class="endingMsg">
            May this year bring you<br>
            more smiles,<br>
            more adventures,<br>
            and countless beautiful moments.
        </p>
    </div>

    <div class="endBlock endingThanks">
        <p>
            Thanks for taking the time<br>
            to visit this little surprise.
        </p>
    </div>

    <div class="endBlock timeGift">
        <p>
            Sometimes,<br>
            the best gifts aren't expensive.<br>
            They're simply made with time.
        </p>
        <span class="endSparkle">✨</span>
    </div>

</section>

</template>

<template id="final-template">

<section class="scene finalScene">

    <div class="terminalBox">
        <div class="terminalHeader">
            <span class="termDot red"></span>
            <span class="termDot yellow"></span>
            <span class="termDot green"></span>
            <span class="termTitle">universe.js</span>
        </div>
        <div id="codeLines"></div>
    </div>

    <div id="successMsg" class="termSuccess">
        ✓ Program Executed Successfully.
    </div>

    <h1 id="endOfTransmission" class="eotText">
        END OF TRANSMISSION
    </h1>

</section>

</template>




    <!-- ===================================================== -->
    <!-- BACKGROUND EFFECT LAYERS                              -->
    <!-- Persist across all scenes                             -->
    <!-- ===================================================== -->

    <div id="background">

        <div id="skyGradient"></div>

        <div id="starsLayer"></div>

        <div id="particleLayer"></div>

        <div id="cloudLayer"></div>

    </div>



    <!-- ===================================================== -->
    <!-- GLOBAL OVERLAYS                                       -->
    <!-- ===================================================== -->

    <div id="overlay-black"></div>

    <div id="overlay-white"></div>

    <div id="flash-layer"></div>

    <div id="confetti-layer"></div>

    <div id="fireworks-layer"></div>

    <!-- ===================================================== -->
    <!-- PDF READER                                            -->
    <!-- ===================================================== -->
    <div id="pdfReader" class="pdf-reader-overlay hidden">
        <div class="pdf-reader-header">
            <button id="pdfReaderClose" class="pdf-reader-close-btn">✕</button>
        </div>
        <div class="pdf-reader-content">
            <canvas id="pdfCanvas"></canvas>
        </div>
        <div class="pdf-reader-footer">
            <button id="pdfReaderPrev" class="pdf-reader-nav-btn">←</button>
            <span id="pdfReaderPageNum" class="pdf-reader-page-num"></span>
            <button id="pdfReaderNext" class="pdf-reader-nav-btn">→</button>
        </div>
    </div>


    <!-- ===================================================== -->
    <!-- AUDIO                                                 -->
    <!-- ===================================================== -->

    <audio id="piano"
           preload="auto">

        <source src="assets/audio/piano.mp3"
                type="audio/mpeg">

    </audio>

    <audio id="birthdaySong"
           preload="auto">

        <source src="assets/audio/birthday.mp3"
                type="audio/mpeg">

    </audio>



    <!-- ===================================================== -->
    <!-- JAVASCRIPT                                            -->
    <!-- ===================================================== -->

<script src="js/app.js"></script>
<script src="js/audio.js"></script>
<script src="js/scenes.js"></script>
<script src="js/animations.js"></script>
    

</body>

</html>
